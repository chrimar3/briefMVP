# Project metadata and tool configuration. The model side runs through Claude Code subagents,
# so there is no model SDK dependency by design (PRD DR-1: buy the model, build the skeleton).
# Exact, tested versions live in requirements.lock (runtime + tests) and requirements-dev.lock
# (that plus ruff, mypy and pytest-cov); the ranges below are the supported window.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brief-builder"
dynamic = ["version"]
description = "Two-stage AI briefing pipeline: deterministic gates around Claude Code subagents (synthetic fixtures only)."
readme = "README.md"
# 3.9 is the floor (the code uses 3.9 APIs such as Path.is_relative_to). POSIX only: run locking
# uses fcntl (pipeline/revisions.py, pipeline/effort.py), so Windows is not supported.
# Known item: CPython 3.9 reached end of life in October 2025 (no security fixes). The floor stays
# at 3.9 because the owner's workstation runs 3.9.6; CI also tests 3.12. Raising it is an owner
# decision (it would let the code use `X | None` at runtime and drop `typing.Optional`).
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9", "PyYAML>=6,<7"]
dev = ["pytest>=7,<9", "PyYAML>=6,<7", "pytest-cov>=4,<6", "mypy>=1.7,<2", "ruff>=0.6,<0.7"]

[tool.setuptools]
packages = ["pipeline"]

[tool.setuptools.dynamic]
version = { attr = "pipeline.PIPELINE_VERSION" }

# ---------------------------------------------------------------------------------------------
# pytest — replaces pytest.ini. --strict-markers lives here, so nobody needs `-o addopts=''`
# any more (that override silently dropped it).
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

# ---------------------------------------------------------------------------------------------
# ruff — pycodestyle errors and warnings (E, W), pyflakes (F), bugbear (B), isort (I), pyupgrade
# (UP, for the 3.9 floor) and a subset of flake8-simplify. `scripts/check.sh` and CI run
# `ruff check .` with the version pinned in requirements-dev.lock.
[tool.ruff]
target-version = "py39"
line-length = 120
extend-include = ["tools/replay/claude"]
extend-exclude = [
    "runs",
    ".codex",
    # Historical records, kept as they were run and never maintained (see its README).
    "tools/walkthrough/archive",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "I", "UP",
    # flake8-simplify, the rules whose rewrite is always clearer: duplicate isinstance, collapsible
    # if, comparison chains, `in dict.keys()`, negated comparisons, double negation, bool ternaries
    # and Yoda conditions. SIM105/SIM108/SIM117 are left out on purpose (the explicit try/except,
    # if/else and nested lock-then-raises `with` blocks read better in this codebase).
    "SIM101", "SIM102", "SIM109", "SIM118", "SIM201", "SIM202", "SIM208", "SIM210", "SIM211", "SIM300",
]

[tool.ruff.lint.pyupgrade]
# Keep `Optional[X]` / `Union[...]` in annotations: the 3.9 floor cannot evaluate `X | None` at
# runtime, and one spelling across files with and without `from __future__ import annotations`
# is easier to read than two.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# Frozen file (CLAUDE.md): it cannot be edited, so only pyflakes correctness beyond its one
# unused import (typing.Callable) is enforced there.
"eval/harness.py" = ["F401", "E", "W", "B", "I", "UP", "SIM"]

# ---------------------------------------------------------------------------------------------
# mypy — non-strict type check of the pipeline package (annotated functions are checked; a
# function without annotations is not, as mypy's default). CI and scripts/check.sh run `mypy`.
[tool.mypy]
python_version = "3.9"
files = ["pipeline"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# ---------------------------------------------------------------------------------------------
# coverage (pytest-cov) — statement coverage of pipeline/ and eval/, measured in-process by the
# test suite (the subprocess entry-point tests are not counted). fail_under is a GATE: the value
# measured when it was introduced (90.1 %, round 2) minus one point. Raise it as coverage grows;
# lowering it is an owner decision.
[tool.coverage.run]
source = ["pipeline", "eval"]

[tool.coverage.report]
fail_under = 89
precision = 1
skip_covered = true
show_missing = true
