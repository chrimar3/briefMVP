# The developer and CI toolchain: the locked runtime + test set, plus the static checks and the
# coverage gate `scripts/check.sh` runs (ruff lint, mypy type check, pytest-cov with a floor).
#   python3 -m pip install -r requirements-dev.lock
# CI installs exactly this file on every matrix leg. Versions: mypy, pytest-cov and coverage are
# the ones the suite passes with on Python 3.9.6 (2026-09-23); ruff 0.6.9 is the version CI has
# linted with since round 1 (it could not be run on the offline workstation that wrote this lock).
# No hashes: this lock was produced offline; regenerate with hashes when a network is available
# (pip-compile --generate-hashes, then install with --require-hashes).
-r requirements.lock
coverage==7.9.2
mypy==1.7.1
mypy-extensions==1.1.0
