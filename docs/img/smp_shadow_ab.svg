<svg xmlns="http://www.w3.org/2000/svg" width="860" height="327" viewBox="0 0 860 327">
<rect width="860" height="327" rx="12" fill="#f9f8f4"/><rect width="860" height="8" fill="#1b4f8a"/>
<text x="40" y="38" font-family="Menlo,monospace" font-size="11" fill="#6b7280" letter-spacing="2">MELTEMI FIZZ · SINGLE-MINDED PROPOSITION · SYSTEM-GENERATED (runs/tier3/creative)</text>
<text x="40" y="66" font-family="Menlo,monospace" font-size="12" fill="#1b4f8a" letter-spacing="2">CANDIDATE A · CLAUDE-SONNET-5</text>
<text x="40" y="92" font-family="Georgia,serif" font-size="17" fill="#22262b">For urban professionals who've outgrown sugary, beach-party fizz, Meltemi</text>
<text x="40" y="117" font-family="Georgia,serif" font-size="17" fill="#22262b">Fizz turns zero-sugar refreshment into a premium, everyday ritual that</text>
<text x="40" y="142" font-family="Georgia,serif" font-size="17" fill="#22262b">only a modern Greek brand could own.</text>
<text x="40" y="189" font-family="Menlo,monospace" font-size="12" fill="#1b4f8a" letter-spacing="2">CANDIDATE B · CLAUDE-OPUS-4-8</text>
<text x="40" y="215" font-family="Georgia,serif" font-size="17" fill="#22262b">Meltemi Fizz is the Greek-made sparkling tea that refreshes your everyday</text>
<text x="40" y="240" font-family="Georgia,serif" font-size="17" fill="#22262b">— zero sugar, nothing to feel guilty about.</text>
<text x="40" y="287" font-family="Menlo,monospace" font-size="11" fill="#8a6d1a">⚠ SHADOW MODE — candidates for the creative lead; no client-agreed SMP exists (recorded as an open question)</text></svg>